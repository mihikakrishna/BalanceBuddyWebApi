name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject tracked generated or temporary files
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '(^|/)(bin|obj|node_modules)/|(^|/)\.DS_Store$|(^|/).*\.log$|(^|/).*\.tmp$|(^|/).*\.binlog$' || true)"
          if [ -n "$forbidden" ]; then
            echo "Tracked files that should not be committed:"
            echo "$forbidden"
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    needs: repo-guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore backend projects
        run: |
          dotnet restore BalanceBuddyWebApi.csproj
          dotnet restore tests/BalanceBuddy.UnitTests/BalanceBuddy.UnitTests.csproj
          dotnet restore tests/BalanceBuddy.FunctionalTests/BalanceBuddy.FunctionalTests.csproj

      - name: Build backend
        run: dotnet build BalanceBuddyWebApi.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/BalanceBuddy.UnitTests/BalanceBuddy.UnitTests.csproj --configuration Release --no-restore --nologo -v minimal

      - name: Run functional tests
        run: dotnet test tests/BalanceBuddy.FunctionalTests/BalanceBuddy.FunctionalTests.csproj --configuration Release --no-restore --nologo -v minimal

  frontend:
    runs-on: ubuntu-latest
    needs: repo-guard
    defaults:
      run:
        working-directory: balancebuddy-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: balancebuddy-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build frontend
        run: npm run build
